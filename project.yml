name: Eddie
options:
  bundleIdPrefix: com.deadalus
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Eddie:
    type: application
    platform: macOS
    sources:
      - Eddie
    dependencies:
      # The MCP helper ships inside the app, next to the main executable.
      - target: eddie-mcp
        embed: true
        copy:
          destination: executables
    info:
      path: Eddie/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie]
        NSMicrophoneUsageDescription: Eddie records voiceovers from your microphone. Recordings stay on this Mac.
        NSSpeechRecognitionUsageDescription: Eddie turns speech in your clips into captions, on this Mac.
        # Filled in only by scripts/release.sh (never committed); empty in source builds.
        EddieGiphyKey: "$(EDDIE_GIPHY_KEY)"
        EddieFreesoundKey: "$(EDDIE_FREESOUND_KEY)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deadalus.eddie
        CODE_SIGN_ENTITLEMENTS: Eddie/Eddie.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Eddie
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Eddie/Info.plist
        EDDIE_GIPHY_KEY: ""
        EDDIE_FREESOUND_KEY: ""
        INFOPLIST_KEY_CFBundleDisplayName: Eddie
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "2"
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  eddie-mcp:
    type: tool
    platform: macOS
    sources:
      - EddieMCP
      - path: Eddie/Agent/AgentProtocol.swift
      - path: Eddie/Agent/EditActionSchema.swift
    settings:
      base:
        PRODUCT_NAME: eddie-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.deadalus.eddie.mcp
        SKIP_INSTALL: YES
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  EddieTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - EddieTests
    dependencies:
      - target: Eddie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deadalus.eddie.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Eddie.app/Contents/MacOS/Eddie"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Eddie:
    build:
      targets:
        Eddie: all
        EddieTests: [test]
    test:
      targets:
        - EddieTests

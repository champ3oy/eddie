name: Eddie
options:
  bundleIdPrefix: local.eddie
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Eddie:
    type: application
    platform: macOS
    sources:
      - Eddie
    info:
      path: Eddie/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie]
        NSMicrophoneUsageDescription: Eddie records voiceovers from your microphone. Recordings stay on this Mac.
        NSSpeechRecognitionUsageDescription: Eddie turns speech in your clips into captions, on this Mac.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.eddie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Eddie
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Eddie/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Eddie
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: NO
  EddieTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - EddieTests
    dependencies:
      - target: Eddie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.eddie.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Eddie.app/Contents/MacOS/Eddie"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Eddie:
    build:
      targets:
        Eddie: all
        EddieTests: [test]
    test:
      targets:
        - EddieTests
